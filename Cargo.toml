[package]
name = "nfs-magic"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
backhand = "0.25"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
nfsserve = "0.11"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
