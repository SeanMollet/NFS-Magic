name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: nfs-magic
            asset: nfs-magic-x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: nfs-magic
            asset: nfs-magic-aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: nfs-magic
            asset: nfs-magic-x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: nfs-magic
            asset: nfs-magic-aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: nfs-magic.exe
            asset: nfs-magic-x86_64-pc-windows-msvc.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: nfs-magic.exe
            asset: nfs-magic-aarch64-pc-windows-msvc.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true